# 构建 tke 三平台二进制 + 打包 skill，发布到 Toolkit Cloud 分发源。
#
# 这是**常用**的那个：tke 和 skill 会频繁改，改完跑一次这里，使用者
# `curl … install.sh | bash` 或 `tke fix` 就能拿到新的。
# 驱动/Chrome 那些几乎不变的东西在另一个 workflow（tke-deps.yml），按需手动跑。
#
# 需要的仓库 Secret：
#   TKC_TOKEN  —— Toolkit Cloud 的上传凭证（Settings → Secrets → Actions）

name: Publish TKE

on:
  # 自动：main 上动了 tke 源码或 skill 就发一版，使用者下次 install/tke fix 就能拿到。
  # 只列真正影响产物的路径——改 docs/ 或 Electron 那边不该触发一轮六平台编译。
  push:
    branches: [main]
    paths:
      - 'bin-proj/toolkit-engine/src/**'
      - 'bin-proj/toolkit-engine/Cargo.toml'
      - 'bin-proj/toolkit-engine/Cargo.lock'
      - 'bin-proj/toolkit-engine/build.rs'
      - 'bin-proj/toolkit-engine/skill/**'
      - '.github/workflows/tke-publish.yml'
  workflow_dispatch:
    inputs:
      targets:
        description: '构建哪些平台'
        type: choice
        default: 'all'
        options: ['all', 'darwin-arm64', 'darwin-amd64', 'linux-amd64', 'linux-arm64', 'windows-amd64', 'windows-386']
      ocr:
        description: 'OCR 能力：online=在线(快,推荐) / full=在线+离线tesseract(慢很多) / none=不带'
        type: choice
        default: 'online'
        options: ['online', 'full', 'none']
      skill_only:
        description: '只发 skill 与两个 install 脚本，不构建二进制（改文档时用，一分钟就完）'
        type: boolean
        default: false
      dry_run:
        description: '只构建打包，不上传（验证 workflow 本身）'
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always
  # push 触发时 inputs 是空的，统一兜底（choice 的默认值只对手动触发生效）
  TARGETS: ${{ inputs.targets || 'all' }}
  OCR: ${{ inputs.ocr || 'online' }}
  # 分发源根：与 install.sh / tke fix 里的默认值保持一致
  TKC_TARGET: 'tookit-engine-resource:tke/'
  ENGINE_DIR: bin-proj/toolkit-engine

jobs:
  # 改了什么决定要不要编译：只动 skill/ 的话六个平台白编十几分钟没有意义
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.f.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2      # 要跟上一个提交比
      - id: f
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "push" ]; then
            # 手动触发：听 skill_only 开关的
            [ "${{ inputs.skill_only }}" = "true" ] && echo "code=0" >> "$GITHUB_OUTPUT" || echo "code=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # 自动触发：源码/构建配置动了才编，只动 skill 文档就跳过编译直接发
          # workflow 自己也算：改了 runner / target / 构建参数，不重编一次就等于没验
          if git diff --name-only HEAD^ HEAD | grep -qE '^(bin-proj/toolkit-engine/(src/|Cargo\.|build\.rs)|\.github/workflows/tke-publish\.yml)'; then
            echo "code=1" >> "$GITHUB_OUTPUT"
            echo "→ 源码有改动，六平台重新构建"
          else
            echo "code=0" >> "$GITHUB_OUTPUT"
            echo "→ 只动了 skill/文档，跳过构建，直接发 skill"
          fi

  build:
    needs: [changes]
    if: ${{ needs.changes.outputs.code == '1' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            runner: macos-14        # Apple Silicon
          - platform: darwin-amd64
            runner: macos-14
            target: x86_64-apple-darwin
            # ⚠️ 不能用 macos-13：GitHub 已**停止发布 Intel mac 镜像**（近百次 runner-images
            # 发布里只剩 macos-14/15/26，全是 Apple Silicon），写 macos-13 会一直等不到
            # runner、卡到超时。改在 arm64 上交叉编译——同一套 Apple SDK 与链接器，
            # Rust 开箱即用
          - platform: linux-amd64
            runner: ubuntu-22.04    # 用 22.04 而非 latest：glibc 更老 = 兼容更多用户机器
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            # ⚠️ 这个平台**只有 tke 本身**：Chrome for Testing 与 Google 的 platform-tools
            # 都不出 arm64 Linux 版（实测 404）。真实用途是 Apple Silicon 上的 Docker/CI，
            # 那里得改用发行版自带的 chromium-driver / adb，`tke fix` 会照实说明
          - platform: windows-amd64
            runner: windows-latest
          - platform: windows-386
            runner: windows-latest
            target: i686-pc-windows-msvc   # 32 位 Windows：runner 是 x64，靠 target 交叉编译
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      # 只构建选中的平台（choice 传 all 时全建）
      - name: 是否构建本平台
        id: gate
        shell: bash
        run: |
          if [ "${TARGETS}" = "all" ] || [ "${TARGETS}" = "${{ matrix.platform }}" ]; then
            echo "go=1" >> "$GITHUB_OUTPUT"
          else
            echo "go=0" >> "$GITHUB_OUTPUT"
            echo "跳过 ${{ matrix.platform }}"
          fi

      - uses: dtolnay/rust-toolchain@stable
        if: steps.gate.outputs.go == '1'

      - uses: Swatinem/rust-cache@v2
        if: steps.gate.outputs.go == '1'
        with:
          workspaces: ${{ env.ENGINE_DIR }}
          key: ${{ matrix.platform }}-${{ env.OCR }}

      # 离线 OCR 要从源码编译 tesseract + leptonica，得先有 cmake/pkg-config
      - name: 装离线 OCR 的构建依赖
        if: steps.gate.outputs.go == '1' && env.OCR == 'full' && runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake pkg-config

      - name: 构建 tke
        if: steps.gate.outputs.go == '1'
        shell: bash
        working-directory: ${{ env.ENGINE_DIR }}
        run: |
          set -euo pipefail
          # 版本号由 build.rs 从环境变量读（各 build 脚本平时干的事，这里直接给）
          BUILD_VERSION="$(node -p "require('../../package.json').version" 2>/dev/null \
            || grep -m1 '"version"' ../../package.json | sed -E 's/.*"version": *"([^"]+)".*/\1/')"
          export BUILD_VERSION
          echo "版本 $BUILD_VERSION / OCR ${OCR}"

          case "${OCR}" in
            full)   FLAGS="" ;;                                          # 默认特性 = 在线 + 离线
            online) FLAGS="--no-default-features --features ocr-online" ;;
            none)   FLAGS="--no-default-features" ;;
          esac

          # 交叉编译目标（目前只有 windows-386 用）：产物落在 target/<triple>/release/
          TARGET="${{ matrix.target }}"
          if [ -n "$TARGET" ]; then
            rustup target add "$TARGET"
            cargo build --release $FLAGS --target "$TARGET"
          else
            cargo build --release $FLAGS
          fi

      # gz 单文件，与分发布局 bin/<platform>/<name>.gz 一致（install.sh 与 tke fix 都按这个取）
      - name: 打包
        if: steps.gate.outputs.go == '1'
        shell: bash
        working-directory: ${{ env.ENGINE_DIR }}
        run: |
          set -euo pipefail
          OUT=target/release
          [ -n "${{ matrix.target }}" ] && OUT="target/${{ matrix.target }}/release"
          BIN="$OUT/tke"
          [ "${{ runner.os }}" = "Windows" ] && BIN="$OUT/tke.exe"

          # 产物必须验，别让跑不起来的东西悄悄进分发源。
          # 但交叉编译的产物在本 runner 上未必能执行（x86_64 产物在 arm64 mac 上要有
          # Rosetta），所以分两档：能执行就执行（最强的验证），执行不了就退回验架构——
          # 弱一些，但绝不是"跳过"。两样都失败才算构建失败。
          if "$BIN" --version; then
            echo "✅ 产物可执行"
          else
            echo "本 runner 执行不了该产物（交叉编译），退回验架构："
            file "$BIN"
            case "${{ matrix.platform }}:$(file -b "$BIN")" in
              darwin-amd64:*x86_64*)      echo "✅ 架构正确 (x86_64)" ;;
              darwin-arm64:*arm64*)       echo "✅ 架构正确 (arm64)" ;;
              windows-386:*80386*|windows-386:*Intel\ i386*) echo "✅ 架构正确 (i386)" ;;
              windows-amd64:*x86-64*)     echo "✅ 架构正确 (x86-64)" ;;
              linux-arm64:*aarch64*)      echo "✅ 架构正确 (aarch64)" ;;
              linux-amd64:*x86-64*)       echo "✅ 架构正确 (x86-64)" ;;
              *) echo "❌ 产物既跑不起来、架构也对不上目标平台" >&2; exit 1 ;;
            esac
          fi
          mkdir -p out/bin/${{ matrix.platform }}
          gzip -c "$BIN" > out/bin/${{ matrix.platform }}/tke.gz
          ls -lh out/bin/${{ matrix.platform }}/

      - uses: actions/upload-artifact@v4
        if: steps.gate.outputs.go == '1'
        with:
          name: tke-${{ matrix.platform }}
          path: ${{ env.ENGINE_DIR }}/out/bin/${{ matrix.platform }}/tke.gz
          retention-days: 3

  publish:
    needs: [changes, build]
    # 只发 skill 时 build 是 skipped，这里仍要跑；build 真失败了才不发
    if: ${{ always() && !cancelled() && needs.build.result != 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 收集二进制
        if: ${{ needs.changes.outputs.code == '1' }}
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: tke-*

      - name: 组装分发目录
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/skill

          # skill 文件：与平台无关，一份就够
          tar --exclude=".DS_Store" -czf dist/skill/tke-ui-test.tar.gz \
              -C "${ENGINE_DIR}/skill" tke-ui-test
          cp "${ENGINE_DIR}/skill/install.sh" dist/install.sh
          cp "${ENGINE_DIR}/skill/install.ps1" dist/install.ps1   # Windows 装不了 bash 那个

          # 二进制：artifacts/tke-<platform>/tke.gz → dist/bin/<platform>/tke.gz
          if [ -d artifacts ]; then
            for d in artifacts/tke-*; do
              [ -d "$d" ] || continue
              p="${d#artifacts/tke-}"
              mkdir -p "dist/bin/$p"      # 有产物才建，空目录上传会报"没有匹配到任何文件"
              cp "$d/tke.gz" "dist/bin/$p/tke.gz"
            done
          fi

          # VERSION：第一行是 tke 版本（体检拿它比对），build 戳是**破 CDN 缓存的键**
          # （Cloudflare 缓存 4h 且不认 no-cache，只有变化的查询参数能破，见 P-19）
          VER="$(grep -m1 '"version"' package.json | sed -E 's/.*"version": *"([^"]+)".*/\1/')"
          {
            echo "tke $VER"
            echo "ocr: ${OCR}"
            echo "build: $(date -u +%Y%m%d-%H%M%S)"
          } > dist/VERSION

          echo "== 待上传 =="
          find dist -type f | sort
          cat dist/VERSION

      # push 触发时 inputs 为空，`!inputs.dry_run` 求值为 true —— 自动发布正是想要的
      - name: 上传到 Toolkit Cloud
        if: ${{ !inputs.dry_run }}
        env:
          TKC_TOKEN: ${{ secrets.TKC_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${TKC_TOKEN:-}" ]; then
            echo "❌ 没有配 TKC_TOKEN（Settings → Secrets and variables → Actions）" >&2
            exit 1
          fi
          up() {
            # 源目录带尾斜杠 = 只传其内容；写成 `.` 会让 key 里混进 ./ 而 502（P-21）
            curl -fsSL https://cloud.test-toolkit.app/script/upload.sh \
              | bash -s -- "$@" "${TKC_TARGET}"
          }

          # 顺序有讲究：**VERSION 必须最后传**。它是破缓存的键，先传的话使用者会拿到
          # 新键去取还没上传完的文件。
          # 只发 skill 那种情况下没有 dist/bin，跳过它——但别写成 `[ -d x ] && up x`：
          # set -e 下条件为假时整行返回 1，会把这一步judge成失败
          if [ -n "$(ls -A dist/bin 2>/dev/null)" ]; then
            up dist/bin
          else
            echo "（本次没有二进制，只发 skill）"
          fi
          up dist/skill dist/install.sh dist/install.ps1
          up dist/VERSION

      - name: 复验分发源
        if: ${{ !inputs.dry_run }}
        shell: bash
        run: |
          set -euo pipefail
          BASE=https://cloud.test-toolkit.app/sl/preview/tookit-engine-resource/tke
          # 带随机参数破缓存,否则可能读到 4 小时前的旧 VERSION
          REMOTE="$(curl -fsSL --max-time 30 "$BASE/VERSION?t=$RANDOM$RANDOM")"
          echo "$REMOTE"
          # 平台对不存在的路径回落 200 + HTML（SPA 兜底），所以要验内容而不是状态码（P-19）
          case "$REMOTE" in
            tke\ *) echo "✅ VERSION 已生效" ;;
            *) echo "❌ 取回的不是 VERSION，多半没传上去" >&2; exit 1 ;;
          esac

          BUILD_KEY="$(printf '%s' "$REMOTE" | sed -n 's/^build: *//p' | head -1)"
          for f in $(cd dist && find bin skill -type f 2>/dev/null || true); do
            url="$BASE/$f?b=$BUILD_KEY"
            head2="$(curl -fsSL --max-time 120 "$url" | head -c2 | od -An -tx1 | tr -d ' \n')"
            if [ "$head2" = "1f8b" ]; then
              echo "  ✅ $f"
            else
              echo "  ❌ $f 取回的不是 gzip（装到网页了？）" >&2
              exit 1
            fi
          done
          echo "使用者侧（mac/Linux）：curl -fsSL $BASE/install.sh | bash"
          echo "使用者侧（Windows）：   irm $BASE/install.ps1 | iex"
