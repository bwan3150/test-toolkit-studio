<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>更新日志 - Toolkit Studio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
            background: #0d0d0d;
            color: #f0f0f0;
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* 导航栏 */
        nav {
            position: fixed;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: none;
            background: rgba(13, 13, 13, 0.5);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            z-index: 1000;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 0;
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 72px;
        }

        .nav-left {
            display: flex;
            align-items: center;
        }

        .logo {
            height: 40px;
            margin-right: 16px;
        }

        .logo-text {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(180deg, #ffffff 0%, #999999 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            transition: opacity 0.3s;
        }

        .nav-left a {
            display: flex;
            align-items: center;
            text-decoration: none;
            gap: 16px;
        }

        .nav-left a:hover .logo-text {
            opacity: 0.8;
        }

        .nav-left a:hover .logo {
            opacity: 0.8;
        }

        .logo {
            transition: opacity 0.3s;
        }

        .nav-links {
            display: flex;
            gap: 32px;
            align-items: center;
        }

        .nav-link {
            color: #999;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: color 0.3s;
        }

        .nav-link:hover {
            color: #f0f0f0;
        }

        .nav-link.active {
            color: #f0f0f0;
        }

        /* 汉堡菜单按钮 */
        .hamburger {
            display: none;
            flex-direction: column;
            gap: 5px;
            background: none;
            border: none;
            cursor: pointer;
            padding: 8px;
            z-index: 1001;
        }

        .hamburger span {
            width: 24px;
            height: 2px;
            background: #f0f0f0;
            border-radius: 2px;
            transition: all 0.3s ease;
        }

        .hamburger.active span:nth-child(1) {
            transform: translateY(7px) rotate(45deg);
        }

        .hamburger.active span:nth-child(2) {
            opacity: 0;
        }

        .hamburger.active span:nth-child(3) {
            transform: translateY(-7px) rotate(-45deg);
        }

        /* 主内容区域 */
        .main-content {
            padding: 120px 40px 80px;
            max-width: 900px;
            margin: 0 auto;
        }

        .page-header {
            text-align: center;
            margin-bottom: 60px;
        }

        .page-title {
            font-size: 48px;
            font-weight: 600;
            margin-bottom: 16px;
            background: linear-gradient(180deg, #ffffff 0%, #999999 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -1px;
        }

        .page-subtitle {
            font-size: 18px;
            color: #666;
        }

        /* 加载状态 */
        .loading {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            margin: 0 auto 20px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: #fe7600;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* 时间线列表 */
        .release-list {
            position: relative;
            padding-left: 60px;
            margin-top: 40px;
        }

        /* 时间线主线条 */
        .timeline-line {
            position: absolute;
            left: 23px;
            top: 0;
            width: 2px;
            height: 100%;
            background: rgba(255, 255, 255, 0.1);
        }

        .timeline-line-progress {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 0%;
            background: linear-gradient(180deg, #fe7600 0%, rgba(254, 118, 0, 0.5) 100%);
            transition: height 0.3s ease-out;
        }

        /* 版本项 */
        .release-item {
            position: relative;
            margin-bottom: 60px;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.6s ease-out, transform 0.6s ease-out;
        }

        .release-item.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* 时间线圆点 */
        .timeline-dot {
            position: absolute;
            left: -46px;
            top: 16px;
            width: 20px;
            height: 20px;
            background: #0d0d0d;
            border: 3px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            transition: all 0.4s ease;
            z-index: 2;
            /* 使用 box-shadow 创建圆点周围的空缺 */
            box-shadow: 0 0 0 6px #0d0d0d;
        }

        .release-item.visible .timeline-dot {
            border-color: #fe7600;
        }

        /* 版本标题区域 */
        .release-header {
            margin-bottom: 20px;
        }

        .release-version {
            font-size: 32px;
            font-weight: 700;
            color: #f0f0f0;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }

        .release-date {
            font-size: 15px;
            color: #666;
            font-weight: 400;
        }

        /* 版本内容 */
        .release-content {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 28px;
            color: #ccc;
            line-height: 1.8;
            transition: all 0.3s;
        }

        .release-item.visible .release-content {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.12);
        }

        /* Markdown 样式 */
        .release-content h1,
        .release-content h2,
        .release-content h3 {
            color: #f0f0f0;
            margin-top: 24px;
            margin-bottom: 12px;
        }

        .release-content h1 {
            font-size: 28px;
            border-bottom: 2px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 8px;
        }

        .release-content h2 {
            font-size: 22px;
        }

        .release-content h3 {
            font-size: 18px;
        }

        .release-content p {
            margin-bottom: 16px;
        }

        .release-content ul,
        .release-content ol {
            margin-left: 24px;
            margin-bottom: 16px;
        }

        .release-content li {
            margin-bottom: 8px;
        }

        .release-content code {
            background: rgba(255, 255, 255, 0.08);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
            font-size: 0.9em;
            color: #fe7600;
        }

        .release-content pre {
            background: rgba(255, 255, 255, 0.05);
            padding: 16px;
            border-radius: 8px;
            overflow-x: auto;
            margin-bottom: 16px;
        }

        .release-content pre code {
            background: none;
            padding: 0;
            color: #f0f0f0;
        }

        .release-content a {
            color: #fe7600;
            text-decoration: none;
        }

        .release-content a:hover {
            text-decoration: underline;
        }

        .release-content blockquote {
            border-left: 3px solid #fe7600;
            padding-left: 16px;
            margin: 16px 0;
            color: #999;
        }

        /* 错误提示 */
        .error-message {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .error-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        /* 底部 */
        footer {
            padding: 60px 40px;
            text-align: center;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            color: #666;
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .page-title {
                font-size: 36px;
            }

            .nav-container {
                padding: 0 20px;
            }

            /* 显示汉堡菜单 */
            .hamburger {
                display: flex;
            }

            /* 移动端导航链接样式 */
            .nav-links {
                position: fixed;
                top: 72px;
                left: 0;
                right: 0;
                background: rgba(13, 13, 13, 0.98);
                backdrop-filter: blur(20px);
                -webkit-backdrop-filter: blur(20px);
                flex-direction: column;
                gap: 0;
                padding: 0;
                max-height: 0;
                overflow: hidden;
                transition: max-height 0.3s ease, padding 0.3s ease;
                border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            }

            .nav-links.active {
                max-height: 300px;
                padding: 20px 0;
            }

            .nav-link {
                padding: 16px 32px;
                font-size: 16px;
                width: 100%;
                text-align: left;
                border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            }

            .nav-link:last-child {
                border-bottom: none;
            }

            /* 时间线移动端调整 */
            .release-list {
                padding-left: 40px;
            }

            .timeline-line {
                left: 15px;
            }

            .timeline-dot {
                left: -31px;
                top: 12px;
                width: 14px;
                height: 14px;
                border-width: 2px;
                box-shadow: 0 0 0 4px #0d0d0d;
            }

            .release-version {
                font-size: 24px;
            }

            .release-content {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <!-- 导航栏 -->
    <nav>
        <div class="nav-container">
            <div class="nav-left">
                <a href="index.html">
                    <img src="toolkit_studio_logo.png" alt="Toolkit Studio" class="logo">
                    <span class="logo-text">Toolkit Studio</span>
                </a>
            </div>
            <button class="hamburger" id="hamburger" aria-label="菜单">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <div class="nav-links" id="navLinks">
                <a href="index.html" class="nav-link">首页</a>
                <a href="index.html#core-features" class="nav-link">核心特性</a>
                <a href="index.html#feature-showcase" class="nav-link">功能展示</a>
                <a href="release-notes.html" class="nav-link active">更新日志</a>
            </div>
        </div>
    </nav>

    <!-- 主内容区 -->
    <div class="main-content">
        <div class="page-header">
            <h1 class="page-title">更新日志</h1>
        </div>

        <!-- 加载状态 -->
        <div id="loading" class="loading">
            <div class="loading-spinner"></div>
            <p>加载中...</p>
        </div>

        <!-- 错误提示 -->
        <div id="error" class="error-message" style="display: none;">
            <div class="error-icon">⚠️</div>
            <p>加载更新日志失败，请稍后再试</p>
        </div>

        <!-- 版本列表 -->
        <div id="releaseList" class="release-list" style="display: none;">
            <!-- 动态生成 -->
        </div>
    </div>

    <!-- 底部 -->
    <footer>
        <p>&copy; 2025 Toolkit Studio</p>
    </footer>

    <!-- Markdown 渲染库 -->
    <script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js"></script>

    <script>
        // S3 配置
        const S3_BASE_URL = 'https://toolkit-studio-updates.s3.ap-southeast-2.amazonaws.com';
        const INDEX_URL = `${S3_BASE_URL}/release-notes/release-note-index.json`;

        // 格式化日期
        function formatDate(dateString) {
            const date = new Date(dateString);
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}年${month}月${day}日`;
        }

        // 获取并显示所有版本的 Release Notes
        async function loadReleaseNotes() {
            const loading = document.getElementById('loading');
            const error = document.getElementById('error');
            const releaseList = document.getElementById('releaseList');

            try {
                // 获取索引文件
                const indexResponse = await fetch(INDEX_URL);
                if (!indexResponse.ok) {
                    throw new Error('Failed to fetch index');
                }

                const index = await indexResponse.json();
                console.log('获取到版本索引:', index);

                // 如果没有版本
                if (!index.versions || index.versions.length === 0) {
                    throw new Error('No versions found');
                }

                // 获取所有版本的 release notes
                const releasePromises = index.versions.map(async (versionInfo) => {
                    try {
                        const noteUrl = `${S3_BASE_URL}/release-notes/${versionInfo.file}`;
                        const response = await fetch(noteUrl);
                        if (!response.ok) {
                            console.warn(`Failed to fetch ${versionInfo.version}`);
                            return null;
                        }
                        const markdown = await response.text();
                        return {
                            ...versionInfo,
                            content: markdown
                        };
                    } catch (err) {
                        console.error(`Error fetching ${versionInfo.version}:`, err);
                        return null;
                    }
                });

                const releases = await Promise.all(releasePromises);
                const validReleases = releases.filter(r => r !== null);

                if (validReleases.length === 0) {
                    throw new Error('No release notes found');
                }

                // 渲染时间线
                releaseList.innerHTML = `
                    <div class="timeline-line">
                        <div class="timeline-line-progress"></div>
                    </div>
                    ${validReleases.map(release => {
                        const html = marked.parse(release.content);
                        return `
                            <div class="release-item">
                                <div class="timeline-dot"></div>
                                <div class="release-header">
                                    <div class="release-version">v${release.version}</div>
                                    <div class="release-date">${formatDate(release.date)}</div>
                                </div>
                                <div class="release-content">
                                    ${html}
                                </div>
                            </div>
                        `;
                    }).join('')}
                `;

                // 显示内容
                loading.style.display = 'none';
                releaseList.style.display = 'block';

                // 初始化滚动动画
                initScrollAnimations();

            } catch (err) {
                console.error('加载 Release Notes 失败:', err);
                loading.style.display = 'none';
                error.style.display = 'block';
            }
        }

        // 初始化滚动动画
        function initScrollAnimations() {
            const releaseItems = document.querySelectorAll('.release-item');
            const timelineProgress = document.querySelector('.timeline-line-progress');
            const releaseList = document.getElementById('releaseList');

            // Intersection Observer 用于检测元素进入视口
            const observerOptions = {
                threshold: 0.2,
                rootMargin: '-50px'
            };

            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('visible');
                    }
                });
            }, observerOptions);

            // 观察所有版本项
            releaseItems.forEach(item => observer.observe(item));

            // 更新时间线进度条
            function updateTimelineProgress() {
                if (!releaseList) return;

                const listRect = releaseList.getBoundingClientRect();
                const listTop = listRect.top;
                const listHeight = listRect.height;
                const windowHeight = window.innerHeight;

                // 计算滚动进度
                let progress = 0;
                if (listTop < windowHeight) {
                    const scrolled = windowHeight - listTop;
                    progress = Math.min(scrolled / listHeight, 1);
                }

                if (timelineProgress) {
                    timelineProgress.style.height = `${progress * 100}%`;
                }
            }

            // 监听滚动
            window.addEventListener('scroll', updateTimelineProgress);
            updateTimelineProgress(); // 初始调用
        }

        // 导航栏灵动岛效果 - 跟随滚动进度
        window.addEventListener('scroll', () => {
            const nav = document.querySelector('nav');
            const scrollY = window.scrollY;

            // 定义各阶段的滚动范围
            const phase1End = 150;      // 圆角变化完成
            const phase2End = 180;      // 宽度收缩完成
            const phase3End = 260;      // 向下移动完成

            // 阶段1: 圆角变化 (0-150px)
            let borderRadius = 0;
            if (scrollY <= phase1End) {
                borderRadius = (scrollY / phase1End) * 50;
            } else {
                borderRadius = 50;
            }

            // 阶段2: 宽度收缩 (60-180px) - 渐进式收缩，与圆角同步
            const widthStart = 60;
            const viewportWidth = window.innerWidth;
            const targetMaxWidth = Math.max(viewportWidth * 0.75, 600); // 屏幕宽度的75%，最小600px
            const startMaxWidth = Math.min(viewportWidth, 1920); // 限制起始最大宽度

            if (scrollY >= widthStart && scrollY <= phase2End) {
                const progress = (scrollY - widthStart) / (phase2End - widthStart);
                // 从视口宽度渐变到目标宽度
                const currentMaxWidth = startMaxWidth - progress * (startMaxWidth - targetMaxWidth);
                nav.style.width = '100%';
                nav.style.maxWidth = `${currentMaxWidth}px`;
            } else if (scrollY > phase2End) {
                nav.style.width = '100%';
                nav.style.maxWidth = `${targetMaxWidth}px`;
            } else {
                nav.style.width = '100%';
                nav.style.maxWidth = 'none';
            }

            // 阶段3: 向下移动 (200-260px)
            let top = 0;
            const topStart = 200;
            if (scrollY >= topStart && scrollY <= phase3End) {
                const progress = (scrollY - topStart) / (phase3End - topStart);
                top = progress * 12;
            } else if (scrollY > phase3End) {
                top = 12;
            }

            // 应用样式
            nav.style.borderRadius = `${borderRadius}px`;
            nav.style.top = `${top}px`;

            // 边框、背景和阴影
            if (scrollY > 60) {
                nav.style.borderBottom = 'none';
                nav.style.border = '1px solid rgba(255, 255, 255, 0.15)';
                // 保持背景透明度一致，稍微增强一点但不超过 0.6
                const bgOpacity = Math.min(0.5 + (scrollY - 60) / 240 * 0.1, 0.6);
                nav.style.background = `rgba(13, 13, 13, ${bgOpacity})`;

                if (scrollY > topStart) {
                    const shadowOpacity = Math.min((scrollY - topStart) / (phase3End - topStart), 1);
                    nav.style.boxShadow = `0 8px 32px rgba(0, 0, 0, ${0.5 * shadowOpacity}), 0 0 0 1px rgba(255, 255, 255, ${0.05 * shadowOpacity})`;
                }
            } else {
                nav.style.border = '';
                nav.style.borderBottom = '1px solid rgba(255, 255, 255, 0.08)';
                nav.style.background = 'rgba(13, 13, 13, 0.5)';
                nav.style.boxShadow = '';
            }
        }, { passive: true });

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', loadReleaseNotes);

        // 汉堡菜单功能
        document.addEventListener('DOMContentLoaded', () => {
            const hamburger = document.getElementById('hamburger');
            const navLinks = document.getElementById('navLinks');

            // 切换菜单
            hamburger.addEventListener('click', () => {
                hamburger.classList.toggle('active');
                navLinks.classList.toggle('active');
            });

            // 点击导航链接后关闭菜单
            const links = navLinks.querySelectorAll('.nav-link');
            links.forEach(link => {
                link.addEventListener('click', () => {
                    hamburger.classList.remove('active');
                    navLinks.classList.remove('active');
                });
            });

            // 点击页面其他区域关闭菜单
            document.addEventListener('click', (e) => {
                if (!hamburger.contains(e.target) && !navLinks.contains(e.target)) {
                    hamburger.classList.remove('active');
                    navLinks.classList.remove('active');
                }
            });
        });
    </script>
</body>
</html>
