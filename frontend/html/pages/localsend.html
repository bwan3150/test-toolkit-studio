<!-- LocalSend page -->
<div class="page" id="localsendPage">
  <div class="localsend-page">

    <!-- Single-line header -->
    <div class="ls-header">
      <h2 class="ls-title">LocalSend</h2>
      <div class="ls-header-actions">
        <div class="ls-iface-chip">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 6c0 0 5-4 11-4s11 4 11 4"/>
            <path d="M5 10c0 0 3-2.5 7-2.5S19 10 19 10"/>
            <path d="M9 14c0 0 1-1 3-1s3 1 3 1"/>
            <circle cx="12" cy="18" r="1.5" fill="currentColor"/>
          </svg>
          <select class="ls-iface-select" id="lsIfaceSelect" title="Select LAN interface">
            <option value="">Detecting...</option>
          </select>
        </div>
        <div class="ls-mode-switcher">
          <button class="ls-mode-btn active" id="lsSendModeBtn">Send</button>
          <button class="ls-mode-btn" id="lsReceiveModeBtn">Receive</button>
        </div>
      </div>
    </div>

    <!-- ── SEND mode ── -->
    <div class="ls-mode-content active" id="lsSendMode">
      <div class="ls-send-layout">

        <!-- Left: device list -->
        <div class="ls-devices-panel">
          <div class="ls-devices-header">
            <span>Nearby</span>
            <div class="ls-scan-dot-wrap" id="lsScanIndicator">
              <div class="ls-scan-dot"></div>
            </div>
          </div>
          <div class="ls-devices-list" id="lsDevicesList">
            <div class="ls-devices-empty" id="lsDevicesEmpty">
              <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">
                <path d="M1 6c0 0 5-4 11-4s11 4 11 4"/>
                <path d="M5 10c0 0 3-2.5 7-2.5S19 10 19 10"/>
                <path d="M9 14c0 0 1-1 3-1s3 1 3 1"/>
                <circle cx="12" cy="18" r="1.5" fill="currentColor"/>
              </svg>
              <span>Looking for devices…</span>
            </div>
          </div>
        </div>

        <!-- Right: send content -->
        <div class="ls-send-content">

          <div class="ls-send-placeholder" id="lsSendPlaceholder">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">
              <path d="M22 2L11 13"/><path d="M22 2L15 22L11 13L2 9L22 2Z"/>
            </svg>
            <p>Select a device to send</p>
          </div>

          <div class="ls-send-panel" id="lsSendPanel" style="display:none;">

            <div class="ls-send-target">
              <div class="ls-send-target-icon" id="lsTargetIcon"></div>
              <div class="ls-send-target-info">
                <div class="ls-send-target-name" id="lsTargetName">—</div>
                <div class="ls-send-target-label" id="lsTargetIp">—</div>
              </div>
            </div>

            <div class="ls-type-tabs">
              <button class="ls-type-tab active" id="lsTextTabBtn">Text</button>
              <button class="ls-type-tab" id="lsFileTabBtn">File</button>
            </div>

            <div id="lsTextSendArea" class="ls-text-area">
              <textarea id="lsTextInput" class="ls-textarea" placeholder="Type a message…" rows="5"></textarea>
              <div class="ls-text-actions">
                <button class="ls-btn ls-btn-ghost" id="lsPasteBtn">Paste</button>
                <button class="ls-btn ls-btn-primary" id="lsSendTextBtn">Send</button>
              </div>
            </div>

            <div id="lsFileSendArea" class="ls-file-area" style="display:none;">
              <div class="ls-drop-zone" id="lsFileDropZone">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                  <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                  <polyline points="14 2 14 8 20 8"/>
                  <line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/>
                </svg>
                <span>Drop file here or <u>browse</u></span>
                <input type="file" id="lsFileInput" style="display:none;" />
              </div>
              <div id="lsSelectedFileRow" class="ls-file-row" style="display:none;">
                <span class="ls-file-icon" id="lsSelectedFileIcon"></span>
                <div class="ls-file-info">
                  <div class="ls-file-name" id="lsSelectedFileName">—</div>
                  <div class="ls-file-size" id="lsSelectedFileSize">—</div>
                </div>
                <button class="ls-clear-btn" id="lsClearFileBtn">
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
                    <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
                  </svg>
                </button>
              </div>
              <div class="ls-file-actions">
                <button class="ls-btn ls-btn-primary" id="lsSendFileBtn" disabled>Send</button>
              </div>
            </div>

            <div id="lsSendProgressArea" class="ls-progress-area" style="display:none;">
              <div class="ls-progress-track">
                <div class="ls-progress-fill" id="lsProgressFill"></div>
              </div>
              <div class="ls-progress-label" id="lsProgressLabel">0%</div>
            </div>

          </div>
        </div>
      </div>
    </div>

    <!-- ── RECEIVE mode ── -->
    <div class="ls-mode-content" id="lsReceiveMode">
      <div class="ls-receive-layout">

        <!-- Your device card -->
        <div class="ls-your-device">
          <div class="ls-device-visual">
            <div class="ls-device-avatar">
              <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="3" width="20" height="14" rx="2"/>
                <line x1="8" y1="21" x2="16" y2="21"/>
                <line x1="12" y1="17" x2="12" y2="21"/>
              </svg>
            </div>
            <div class="ls-device-ring ls-ring-1"></div>
            <div class="ls-device-ring ls-ring-2"></div>
          </div>
          <div class="ls-device-meta">
            <div class="ls-device-name" id="lsDeviceBadge">Loading…</div>
            <div class="ls-device-addr">
              <span class="ls-iface-pill" id="lsReceiveIfaceBadge" style="display:none;"></span>
              <span id="lsReceiveIpBadge">…</span>
            </div>
          </div>
          <div class="ls-visible-badge">
            <div class="ls-visible-dot"></div>
            Visible
          </div>
        </div>

        <!-- Save location -->
        <div class="ls-save-row">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;opacity:0.5;">
            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
          </svg>
          <span class="ls-save-path" id="lsSaveDirPath">Loading…</span>
          <button class="ls-btn ls-btn-ghost ls-btn-sm" id="lsChangeSaveDirBtn">Change</button>
        </div>

        <!-- Incoming transfer -->
        <div id="lsIncomingArea" style="display:none;">
          <div class="ls-incoming">
            <div class="ls-incoming-header">
              <div class="ls-incoming-spinner"></div>
              <span id="lsIncomingFrom">From …</span>
            </div>
            <div class="ls-incoming-files" id="lsIncomingFiles">Receiving…</div>
            <div class="ls-progress-area" style="margin-top:8px;">
              <div class="ls-progress-track">
                <div class="ls-progress-fill" id="lsReceiveProgressFill"></div>
              </div>
              <div class="ls-progress-label" id="lsReceiveProgressLabel">0%</div>
            </div>
          </div>
        </div>

        <!-- Received history -->
        <div class="ls-history-header">
          <span>Received</span>
          <button class="ls-btn ls-btn-ghost ls-btn-sm" id="lsClearReceivedBtn">Clear</button>
        </div>
        <div class="ls-received-list" id="lsReceivedList">
          <div class="ls-received-empty" id="lsReceivedEmpty">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
              <polyline points="14 2 14 8 20 8"/>
            </svg>
            <span>No files received yet</span>
          </div>
        </div>

      </div>
    </div>

  </div>
</div>
