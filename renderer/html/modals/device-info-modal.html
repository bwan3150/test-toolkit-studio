<!-- 设备详细信息模态窗口 -->
<div class="modal" id="deviceInfoModal" style="display: none">
  <div class="modal-content modal-large">
    <div class="modal-header">
      <h3 id="deviceInfoModalTitle">Device Information</h3>
      <button class="modal-close" id="closeDeviceInfoModal">&times;</button>
    </div>
    <div class="modal-body">
      <div id="deviceInfoContent">
        <!-- 加载状态 -->
        <div class="loading-state" id="deviceInfoLoading">
          <div class="spinner"></div>
          <p>正在获取设备信息...</p>
        </div>

        <!-- 错误状态 -->
        <div class="error-state" id="deviceInfoError" style="display: none">
          <svg viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/>
            <line x1="12" y1="8" x2="12" y2="12"/>
            <line x1="12" y1="16" x2="12.01" y2="16"/>
          </svg>
          <p id="deviceInfoErrorMessage">Failed to load device information</p>
        </div>

        <!-- 设备信息展示 -->
        <div id="deviceInfoData" style="display: none">
          <!-- 基础信息 -->
          <div class="info-section">
            <h4 class="info-section-title">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="5" y="2" width="14" height="20" rx="2" ry="2"/>
                <line x1="12" y1="18" x2="12.01" y2="18"/>
              </svg>
              基础信息
            </h4>
            <div class="info-grid">
              <div class="info-item">
                <span class="info-label">设备 ID</span>
                <span class="info-value" id="info-device-id">-</span>
              </div>
              <div class="info-item">
                <span class="info-label">型号</span>
                <span class="info-value" id="info-model">-</span>
              </div>
              <div class="info-item">
                <span class="info-label">制造商</span>
                <span class="info-value" id="info-manufacturer">-</span>
              </div>
              <div class="info-item">
                <span class="info-label">Android 版本</span>
                <span class="info-value" id="info-android-version">-</span>
              </div>
              <div class="info-item">
                <span class="info-label">屏幕分辨率</span>
                <span class="info-value" id="info-screen-resolution">-</span>
              </div>
            </div>
          </div>

          <!-- 硬件信息 -->
          <div class="info-section">
            <h4 class="info-section-title">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="4" y="4" width="16" height="16" rx="2" ry="2"/>
                <rect x="9" y="9" width="6" height="6"/>
                <line x1="9" y1="1" x2="9" y2="4"/>
                <line x1="15" y1="1" x2="15" y2="4"/>
                <line x1="9" y1="20" x2="9" y2="23"/>
                <line x1="15" y1="20" x2="15" y2="23"/>
                <line x1="20" y1="9" x2="23" y2="9"/>
                <line x1="20" y1="14" x2="23" y2="14"/>
                <line x1="1" y1="9" x2="4" y2="9"/>
                <line x1="1" y1="14" x2="4" y2="14"/>
              </svg>
              硬件信息
            </h4>
            <div class="info-grid">
              <div class="info-item">
                <span class="info-label">CPU 型号</span>
                <span class="info-value" id="info-cpu-model">-</span>
              </div>
              <div class="info-item">
                <span class="info-label">CPU 核心数</span>
                <span class="info-value" id="info-cpu-cores">-</span>
              </div>
              <div class="info-item">
                <span class="info-label">CPU 架构</span>
                <span class="info-value" id="info-cpu-abi">-</span>
              </div>
              <div class="info-item">
                <span class="info-label">总内存</span>
                <span class="info-value" id="info-total-memory">-</span>
              </div>
              <div class="info-item">
                <span class="info-label">可用内存</span>
                <span class="info-value" id="info-available-memory">-</span>
              </div>
              <div class="info-item">
                <span class="info-label">总存储空间</span>
                <span class="info-value" id="info-total-storage">-</span>
              </div>
              <div class="info-item">
                <span class="info-label">可用存储空间</span>
                <span class="info-value" id="info-available-storage">-</span>
              </div>
            </div>
          </div>

          <!-- 电池信息 -->
          <div class="info-section">
            <h4 class="info-section-title">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="1" y="6" width="18" height="12" rx="2" ry="2"/>
                <line x1="23" y1="13" x2="23" y2="11"/>
              </svg>
              电池信息
            </h4>
            <div class="info-grid">
              <div class="info-item">
                <span class="info-label">电量</span>
                <span class="info-value" id="info-battery-level">-</span>
              </div>
              <div class="info-item">
                <span class="info-label">温度</span>
                <span class="info-value" id="info-battery-temperature">-</span>
              </div>
              <div class="info-item">
                <span class="info-label">健康状态</span>
                <span class="info-value" id="info-battery-health">-</span>
              </div>
              <div class="info-item">
                <span class="info-label">充电状态</span>
                <span class="info-value" id="info-battery-status">-</span>
              </div>
              <div class="info-item">
                <span class="info-label">电源类型</span>
                <span class="info-value" id="info-battery-power-source">-</span>
              </div>
            </div>
          </div>

          <!-- 网络信息 -->
          <div class="info-section">
            <h4 class="info-section-title">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 20h.01"/>
                <path d="M2 8.82a15 15 0 0 1 20 0"/>
                <path d="M5 12.859a10 10 0 0 1 14 0"/>
                <path d="M8.5 16.429a5 5 0 0 1 7 0"/>
              </svg>
              网络信息
            </h4>
            <div class="info-grid">
              <div class="info-item">
                <span class="info-label">WiFi 状态</span>
                <span class="info-value" id="info-wifi-enabled">-</span>
              </div>
              <div class="info-item">
                <span class="info-label">WiFi SSID</span>
                <span class="info-value" id="info-wifi-ssid">-</span>
              </div>
              <div class="info-item">
                <span class="info-label">移动网络类型</span>
                <span class="info-value" id="info-mobile-network-type">-</span>
              </div>
              <div class="info-item">
                <span class="info-label">运营商</span>
                <span class="info-value" id="info-operator-name">-</span>
              </div>
              <div class="info-item">
                <span class="info-label">国家代码</span>
                <span class="info-value" id="info-country-iso">-</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" id="refreshDeviceInfo">刷新</button>
      <button class="btn btn-primary" id="closeDeviceInfoModalBtn">关闭</button>
    </div>
  </div>
</div>

<style>
  /* 设备信息模态窗口样式 */
  .info-section {
    margin-bottom: 24px;
  }

  .info-section:last-child {
    margin-bottom: 0;
  }

  .info-section-title {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 16px;
    font-weight: 600;
    color: var(--text-primary);
    margin-bottom: 16px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border-color);
  }

  .info-section-title svg {
    color: var(--primary-color);
  }

  .info-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 16px;
  }

  .info-item {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .info-label {
    font-size: 12px;
    color: var(--text-secondary);
    font-weight: 500;
  }

  .info-value {
    font-size: 14px;
    color: var(--text-primary);
    font-family: 'SF Mono', 'Monaco', 'Inconsolata', 'Fira Code', 'Consolas', monospace;
  }

  .loading-state,
  .error-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 48px 24px;
    text-align: center;
  }

  .spinner {
    width: 40px;
    height: 40px;
    border: 3px solid var(--border-color);
    border-top-color: var(--primary-color);
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin-bottom: 16px;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .error-state svg {
    color: var(--danger-color);
    margin-bottom: 16px;
  }

  .error-state p {
    color: var(--text-secondary);
  }
</style>
