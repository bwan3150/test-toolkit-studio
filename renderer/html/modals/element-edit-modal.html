<!-- 元素编辑模态框 -->
<div class="modal" id="elementEditModal" style="display: none;">
  <div class="eem-dialog">
    <div class="eem-header">
      <span id="elementEditModalTitle">编辑元素</span>
      <button class="eem-close" id="closeElementEditModal">&times;</button>
    </div>
    <div class="eem-body">
      <div class="eem-props" id="elementEditProps"></div>
    </div>
    <div class="eem-footer">
      <button class="eem-btn" id="cancelElementEdit">取消</button>
      <button class="eem-btn primary" id="confirmElementEdit">保存</button>
    </div>
  </div>
</div>

<!-- 图片预览大图模态框 -->
<div class="modal" id="imagePreviewModal" style="display: none;">
  <div class="ipm-dialog">
    <button class="ipm-close" id="closeImagePreview">&times;</button>
    <img id="imagePreviewContent" src="" alt="预览">
  </div>
</div>
